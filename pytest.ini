[pytest]
# The project's tests live in tests/. Bare `pytest -q` must collect exactly
# those.
#
# Without `testpaths`, pytest walks the whole repository and picks up
# `rithish__code_1/.../scripts/colab_ocr_gap_wagon_test.py` -- a file from the
# ADDED LEGACY SOURCE TREE, which is reference material, not a test. It matches
# the default `*_test.py` pattern, imports `tqdm` and the OCR stack, and so
# aborts the whole run at collection with a ModuleNotFoundError before a single
# real test executes.
#
# That tree is deliberately kept in the repo as the provenance of
# `inspection/legacy/` (see LEGACY_INSPECTION_PORT.md), and
# TestLegacyProvenance diffs the vendored copies against it -- so it must stay
# on disk while staying out of collection.
testpaths = tests
norecursedirs = rithish__code_1 old_code inputs results* __pycache__ .git
